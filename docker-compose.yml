services:
  postgres:
    image: postgres:16-alpine
    container_name: creatorhub-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-creatorhub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
      POSTGRES_DB: ${POSTGRES_DB:-creatorhub}
    volumes:
      - creatorhub_postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5434 — avoid 5432 (common default / other stacks may bind it)
      - "${POSTGRES_PORT:-5434}:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-creatorhub} -d ${POSTGRES_DB:-creatorhub}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - creatorhub

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: creatorhub-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: ${PORT:-5002}
      # In-compose network: talk to postgres on internal 5432
      NEON_DB_URI: postgresql://${POSTGRES_USER:-creatorhub}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-creatorhub}
      DATABASE_URL: postgresql://${POSTGRES_USER:-creatorhub}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-creatorhub}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3030}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      # Host 5030 — sockets / direct API; avoid 4000, 5000, 5020, 8000 (other Hostinger apps)
      - "${API_HOST_PORT:-5030}:${PORT:-5002}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://127.0.0.1:${PORT:-5002}/",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - creatorhub

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend
      args:
        # Same-origin /api (Next rewrite → API_URL). Sockets still need a public host URL.
        API_URL: ${API_URL:-http://api:5002}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5030}
        NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${NEXT_PUBLIC_TURNSTILE_SITE_KEY:-}
    container_name: creatorhub-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Runtime rewrite target (standalone server reads this for next.config if needed;
      # primary bake is at build time via ARG/ENV above).
      API_URL: ${API_URL:-http://api:5002}
      NEON_DB_URI: postgresql://${POSTGRES_USER:-creatorhub}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-creatorhub}
      DATABASE_URL: postgresql://${POSTGRES_USER:-creatorhub}:${POSTGRES_PASSWORD:-changeme}@postgres:5432/${POSTGRES_DB:-creatorhub}
      JWT_SECRET: ${JWT_SECRET:-0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
      NEXT_PUBLIC_SOCKET_URL: ${NEXT_PUBLIC_SOCKET_URL:-http://localhost:5030}
    ports:
      # Host 3030 — avoid 3000-3002, 3010, 3020-3021 used by other Hostinger apps
      - "${FRONTEND_HOST_PORT:-3030}:3000"
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
    networks:
      - creatorhub

volumes:
  creatorhub_postgres_data:

networks:
  creatorhub:
    name: creatorhub
    driver: bridge
